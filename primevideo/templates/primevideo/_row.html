<section class="section"><div class="section-head"><div><p class="kicker">{{ kicker }}</p><h2>{{ heading }}</h2></div><button class="see-all">See all <span>→</span></button></div><div class="poster-row">{% for title in items %}<article class="poster" data-id="{{ title.id }}" tabindex="0" role="button"><img src="{{ title.image }}" alt="{{ title.title }}" loading="lazy"><div><h3>{{ title.title }}</h3><small>{{ title.year }} · {{ title.genre }}</small></div></article>{% endfor %}</div></section>
